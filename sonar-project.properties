sonar.projectKey=Ju-221_MIB-SOEN341_Project_W26
sonar.organization=ju-221
sonar.projectName=MIB-SOEN341_Project_W26
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Source directories (relative to sonar-project.properties)
sonar.sources=frontend/src,express

# Test directories
sonar.tests=frontend/src

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions from source analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/drizzle/**,\
  **/drizzle/meta/**,\
  frontend/src/test/**,\
  frontend/public/**,\
  frontend/src/assets/uploads/*.png

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  frontend/src/test/**,\
  frontend/src/main.tsx,\
  express/server.ts,\
  express/db/index.ts

# LCOV coverage report path (generated by Vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# TypeScript/JavaScript settings
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json