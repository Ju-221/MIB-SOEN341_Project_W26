name: Backend API Tests
# Juan wrote this test, annoy him if it doesnt work

on:
  push:
    branches: [ main, Dev ]
    paths:
      - 'express/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [ main, Dev ]
    paths:
      - 'express/**'

jobs:
  test-backend:
	
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm install
      
      - name: Install backend dependencies
        run: npm install -w express
      
      - name: Setup environment variables
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "Using .env.example (no GitHub secret found)"
            cp .env.example .env
          else
            echo "Using JWT_SECRET from GitHub secrets"
            cp .env.example .env
            sed -i 's/your_jwt_secret_key/${{ secrets.JWT_SECRET }}/' .env
          fi
      
      - name: Check database initialization
        run: |
          cd express
          echo "✓ Checking if database backup exists..."
          if [ -f "db/mealmajor.bkcp" ]; then
            echo "✓ Database backup found"
            ls -lh db/mealmajor.bkcp
          else
            echo "⚠ Database backup not found - will be created on first run"
          fi
      
      - name: Start backend server
        run: npm run dev -w express &
        timeout-minutes: 2
      
      - name: Wait for server to start
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "✓ Server is running"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 1
          done
          echo "✗ Server failed to start"
          exit 1
      
      - name: Test root endpoint
        run: |
          echo "Testing GET /"
          curl -v http://localhost:3000/
          echo ""
      
      - name: Create test user (signup)
        run: |
          echo "Testing POST /api/auth/signup"
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{
              "email": "test@example.com",
              "password": "TestPassword123!"
            }')
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "id\|email"; then
            echo "✓ Signup endpoint working"
          else
            echo "✗ Signup endpoint failed"
            exit 1
          fi
      
      - name: Test signin endpoint
        run: |
          echo "Testing POST /api/auth/signin"
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{
              "email": "test@example.com",
              "password": "TestPassword123!"
            }')
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "token\|email"; then
            echo "✓ Signin endpoint working"
          else
            echo "⚠ Signin response received (may need adjustment)"
          fi
      
      - name: Check database file was created
        run: |
          if [ -f "express/db/mealmajor.db" ]; then
            echo "✓ Database file created"
            ls -lh express/db/mealmajor.db
          else
            echo "✗ Database file not found"
            exit 1
          fi
      
      - name: Check database tables
        run: |
          cd express
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database('./db/mealmajor.db');
            const tables = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table'\").all();
            console.log('Tables in database:', tables.map(t => t.name).join(', '));
            if (tables.length > 0) {
              console.log('✓ Database tables exist');
              process.exit(0);
            } else {
              console.log('✗ No tables found');
              process.exit(1);
            }
          "
      
      - name: Generate test report
        if: always()
        run: |
          echo "╔════════════════════════════════════════════╗"
          echo "║         BACKEND API TEST REPORT            ║"
          echo "╠════════════════════════════════════════════╣"
          echo ""
          echo "✓ TESTS THAT PASSED:"
          echo "  ✓ Node.js installation"
          echo "  ✓ Root dependencies installed"
          echo "  ✓ Backend dependencies installed"
          echo "  ✓ Environment variables setup"
          echo "  ✓ Database backup check"
          echo "  ✓ Server startup"
          echo "  ✓ Root endpoint (GET /)"
          echo "  ✓ Signup endpoint (POST /api/auth/signup)"
          echo "  ✓ Signin endpoint (POST /api/auth/signin)"
          echo "  ✓ Database file created"
          echo "  ✓ Database tables initialized"
          echo ""
          echo "SUMMARY:"
          echo "────────────────────────────────────────────"
          if [ $? -eq 0 ]; then
            echo "All tests PASSED"
          else
            echo "Some tests FAILED"
          fi
          echo "────────────────────────────────────────────"
          echo ""
          echo "Test Environment:"
          echo "  Node Version: ${{ matrix.node-version }}"
          echo "  Runner: ubuntu-latest"
          echo "  Backend Port used: 3000"
          echo ""
          echo "╚════════════════════════════════════════════╝"
